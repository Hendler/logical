<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">Types shape the proof.</title>
  <desc id="desc">Ada is an object and an instance of the person category. Person is a subclass of mammal. An explicit universal rule says all mammals breathe. Together these three premises entail that Ada breathes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#53746b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1120" height="550" rx="24" fill="#f5f3eb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193b35">
    <text x="48" y="48" font-size="13" font-weight="700" letter-spacing="2.5">A SMALL PROOF / THREE EXPLICIT PREMISES</text>
    <text x="48" y="99" font-size="40" font-weight="700" letter-spacing="-1.3">Types shape the proof.</text>
    <text x="48" y="132" font-size="19" fill="#577268">An individual, a class, and a rule each mean something different.</text>

    <circle cx="155" cy="243" r="60" fill="#187b65"/>
    <circle cx="155" cy="243" r="70" fill="none" stroke="#cbd9c7"/>
    <text x="155" y="252" text-anchor="middle" font-size="29" font-weight="700" fill="#fffefa">Ada</text>
    <text x="155" y="338" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#577268">OBJECT</text>
    <text x="155" y="365" text-anchor="middle" font-size="17" fill="#577268">One particular individual</text>

    <path d="M242 243H404" stroke="#53746b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="321" y="222" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#416959">instance_of</text>
    <circle cx="322" cy="274" r="12" fill="#e9e7dc"/>
    <text x="322" y="279" text-anchor="middle" font-size="13" font-weight="700">1</text>

    <rect x="423" y="179" width="214" height="128" rx="25" fill="#e9efe3" stroke="#91ad98"/>
    <rect x="433" y="189" width="194" height="108" rx="19" fill="none" stroke="#c6d4c0" stroke-dasharray="3 5"/>
    <g fill="#97b79f"><circle cx="507" cy="210" r="4"/><circle cx="530" cy="210" r="4"/><circle cx="553" cy="210" r="4"/></g>
    <text x="530" y="256" text-anchor="middle" font-size="28" font-weight="700">person</text>
    <text x="530" y="338" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#577268">CATEGORY</text>
    <text x="530" y="365" text-anchor="middle" font-size="17" fill="#577268">A class of individuals</text>

    <path d="M654 243H815" stroke="#53746b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="734" y="222" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#416959">subclass_of</text>
    <circle cx="734" cy="274" r="12" fill="#e9e7dc"/>
    <text x="734" y="279" text-anchor="middle" font-size="13" font-weight="700">2</text>

    <rect x="834" y="179" width="214" height="128" rx="25" fill="#e9efe3" stroke="#91ad98"/>
    <rect x="844" y="189" width="194" height="108" rx="19" fill="none" stroke="#c6d4c0" stroke-dasharray="3 5"/>
    <g fill="#97b79f"><circle cx="918" cy="210" r="4"/><circle cx="941" cy="210" r="4"/><circle cx="964" cy="210" r="4"/></g>
    <text x="941" y="256" text-anchor="middle" font-size="28" font-weight="700">mammal</text>
    <path d="M941 308V326" stroke="#a67b45" stroke-width="2"/>
    <rect x="825" y="326" width="232" height="57" rx="12" fill="#f2dfbd"/>
    <circle cx="844" cy="355" r="11" fill="#e4c590"/>
    <text x="844" y="360" text-anchor="middle" font-size="13" font-weight="700">3</text>
    <text x="866" y="350" font-size="13" font-weight="700" letter-spacing=".7" fill="#72542e">UNIVERSAL RULE</text>
    <text x="866" y="372" font-size="16" fill="#72542e">All mammals breathe.</text>

    <rect x="48" y="419" width="1024" height="91" rx="16" fill="#193b35"/>
    <circle cx="83" cy="465" r="13" fill="#c9e29a"/>
    <path d="M77 465L81 469L89 460" stroke="#193b35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="452" font-size="12" font-weight="700" letter-spacing="1.5" fill="#b9d2bd">ENTAILED FROM THE PREMISES</text>
    <text x="116" y="485" font-size="29" font-weight="700" fill="#fffefa">Ada breathes.</text>
    <path d="M704 437V492" stroke="#446153"/>
    <text x="735" y="455" font-size="17" fill="#d3e5cc">Proof: 1 + 2 + 3</text>
    <text x="735" y="481" font-size="15" fill="#b9d2bd">The universal rule is explicitly sourced.</text>
  </g>
</svg>
