<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="574" viewBox="0 0 1120 574" role="img" aria-labelledby="title desc">
  <title id="title">Freshness follows the evidence.</title>
  <desc id="desc">Source A says Robert is Bob and is due for review on September 15. Source B says Bob won the prize and is current until September 30. Robert won the prize is supported on September 14, but becomes unknown on September 16 when its required identity premise is stale. Independent current support for the same identity can preserve the proof.</desc>
  <rect width="1120" height="574" rx="24" fill="#f5f3eb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193b35">
    <text x="48" y="48" font-size="13" font-weight="700" letter-spacing="2.5">IDENTITY IS EVIDENCE / EVIDENCE HAS A LIFETIME</text>
    <text x="48" y="99" font-size="40" font-weight="700" letter-spacing="-1.3">Freshness follows the evidence.</text>
    <text x="48" y="132" font-size="19" fill="#577268">A current quotation can still depend on an identity that needs review.</text>

    <rect x="48" y="171" width="480" height="135" rx="16" fill="#fffefa" stroke="#d5dcd0"/>
    <rect x="72" y="192" width="26" height="26" rx="7" fill="#e9efe3"/>
    <text x="85" y="211" text-anchor="middle" font-size="15" font-weight="700">A</text>
    <text x="109" y="211" font-size="13" font-weight="700" letter-spacing="1.3" fill="#577268">IDENTITY SOURCE</text>
    <text x="72" y="254" font-size="24" font-weight="700">“Robert is also called Bob.”</text>
    <text x="72" y="282" font-size="16" fill="#8b663b">Review due September 15</text>

    <rect x="592" y="171" width="480" height="135" rx="16" fill="#fffefa" stroke="#d5dcd0"/>
    <rect x="616" y="192" width="26" height="26" rx="7" fill="#e9efe3"/>
    <text x="629" y="211" text-anchor="middle" font-size="15" font-weight="700">B</text>
    <text x="653" y="211" font-size="13" font-weight="700" letter-spacing="1.3" fill="#577268">ASSERTION SOURCE</text>
    <text x="616" y="254" font-size="24" font-weight="700">“Bob won the prize.”</text>
    <text x="616" y="282" font-size="16" fill="#577268">Review due September 30</text>

    <path d="M288 307V329Q288 341 300 341H415M832 307V329Q832 341 820 341H705" stroke="#a3b4a4" stroke-width="1.8" fill="none"/>
    <text x="560" y="348" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19" fill="#416959">robert won prize</text>

    <rect x="48" y="382" width="480" height="137" rx="16" fill="#193b35"/>
    <text x="72" y="412" font-size="13" font-weight="700" letter-spacing="1.5" fill="#b9d2bd">SEPTEMBER 14 / SUPPORTED</text>
    <text x="72" y="457" font-family="Menlo, Consolas, monospace" font-size="22" fill="#d3e5cc">A + B</text>
    <path d="M179 449H214M208 443L214 449L208 455" stroke="#b9d2bd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="232" y="458" font-size="29" font-weight="700" fill="#d3eaa6">true</text>
    <text x="72" y="492" font-size="16" fill="#c4d7c4">Both required premises are current.</text>

    <rect x="592" y="382" width="480" height="137" rx="16" fill="#efe2c9" stroke="#dfca9e"/>
    <text x="616" y="412" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7c5a32">SEPTEMBER 16 / IDENTITY STALE</text>
    <text x="616" y="457" font-family="Menlo, Consolas, monospace" font-size="22" fill="#866c4d">A + B</text>
    <path d="M615 449L632 449" stroke="#9c5c39" stroke-width="2.5"/>
    <path d="M723 449H758M752 443L758 449L752 455" stroke="#9c805b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="776" y="458" font-size="29" font-weight="700" fill="#7c5a32">unknown</text>
    <text x="616" y="492" font-size="16" fill="#7c6344">B is current. Its identity premise is stale.</text>

    <text x="48" y="552" font-size="15" fill="#577268">Independent current evidence for the same identity can keep the proof valid.</text>
  </g>
</svg>
