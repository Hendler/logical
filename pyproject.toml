[project]
name = "logical"
version = "0.3.0"
description = "Source-backed knowledge compression with typed logic, proofs, and freshness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathan Hendler" }]
dependencies = [
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
logical = "logical.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
